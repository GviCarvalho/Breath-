version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: breath-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: breath_user
      POSTGRES_PASSWORD: breath_password
      POSTGRES_DB: breath_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U breath_user -d breath_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
